<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8fafc" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#334155">AI Development Tool System Architecture</text>
  
  <!-- Client Layer -->
  <rect x="100" y="80" width="800" height="120" rx="10" ry="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="500" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e40af">Client Layer</text>
  
  <!-- Client Components -->
  <rect x="150" y="130" width="160" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <text x="230" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">React Components</text>
  
  <rect x="350" y="130" width="160" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <text x="430" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">Shadcn UI / Tailwind</text>
  
  <rect x="550" y="130" width="160" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <text x="630" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">Code Editor</text>
  
  <rect x="750" y="130" width="100" height="50" rx="8" ry="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
  <text x="800" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e40af">Charts</text>
  
  <!-- Server Layer -->
  <rect x="100" y="220" width="800" height="160" rx="10" ry="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="2" />
  <text x="500" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#4338ca">Application Layer (Next.js)</text>
  
  <!-- Server Components -->
  <rect x="150" y="280" width="100" height="70" rx="8" ry="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1" />
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4338ca">Auth</text>
  
  <rect x="270" y="280" width="120" height="70" rx="8" ry="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1" />
  <text x="330" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4338ca">Project API</text>
  
  <rect x="410" y="280" width="120" height="70" rx="8" ry="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1" />
  <text x="470" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4338ca">Solution API</text>
  
  <rect x="550" y="280" width="120" height="70" rx="8" ry="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1" />
  <text x="610" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4338ca">Merge API</text>
  
  <rect x="690" y="280" width="160" height="70" rx="8" ry="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1" />
  <text x="770" y="315" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4338ca">Analytics API</text>
  
  <!-- Service Layer -->
  <rect x="100" y="400" width="800" height="140" rx="10" ry="10" fill="#dcfce7" stroke="#34d399" stroke-width="2" />
  <text x="500" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#166534">Service Layer</text>
  
  <!-- Service Components -->
  <rect x="150" y="450" width="170" height="60" rx="8" ry="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="235" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">AI Model Service</text>
  
  <rect x="340" y="450" width="170" height="60" rx="8" ry="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="425" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">Sandbox Service</text>
  
  <rect x="530" y="450" width="170" height="60" rx="8" ry="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="615" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">Merge Service</text>
  
  <rect x="720" y="450" width="150" height="60" rx="8" ry="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="795" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#166534">Analytics Service</text>
  
  <!-- External Services Layer -->
  <rect x="100" y="560" width="800" height="120" rx="10" ry="10" fill="#fee2e2" stroke="#f87171" stroke-width="2" />
  <text x="500" y="590" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#991b1b">External Services</text>
  
  <!-- External Services Components -->
  <rect x="150" y="610" width="140" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
  <text x="220" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">OpenAI API</text>
  
  <rect x="310" y="610" width="140" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
  <text x="380" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">Anthropic API</text>
  
  <rect x="470" y="610" width="140" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
  <text x="540" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">Docker API</text>
  
  <rect x="630" y="610" width="140" height="50" rx="8" ry="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1" />
  <text x="700" y="640" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#991b1b">Supabase</text>
  
  <!-- Database Layer -->
  <rect x="100" y="700" width="800" height="80" rx="10" ry="10" fill="#ddd6fe" stroke="#a78bfa" stroke-width="2" />
  <text x="500" y="730" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#5b21b6">Database Layer</text>
  
  <!-- Database Components -->
  <rect x="200" y="750" width="200" height="20" rx="5" ry="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" />
  <text x="300" y="765" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b21b6">User and Project Tables</text>
  
  <rect x="420" y="750" width="200" height="20" rx="5" ry="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" />
  <text x="520" y="765" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b21b6">Solutions and Metrics Tables</text>
  
  <rect x="640" y="750" width="200" height="20" rx="5" ry="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" />
  <text x="740" y="765" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5b21b6">Analytics Tables</text>
  
  <!-- Connection Lines -->
  <!-- Client to Server -->
  <line x1="500" y1="200" x2="500" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Server to Service -->
  <line x1="500" y1="380" x2="500" y2="400" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Service to External -->
  <line x1="500" y1="540" x2="500" y2="560" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- External to Database -->
  <line x1="500" y1="680" x2="500" y2="700" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5" />
  
  <!-- Legend -->
  <rect x="800" y="35" width="15" height="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="1" />
  <text x="820" y="48" font-family="Arial, sans-serif" font-size="12" fill="#334155">Client</text>
  
  <rect x="800" y="55" width="15" height="15" fill="#e0e7ff" stroke="#818cf8" stroke-width="1" />
  <text x="820" y="68" font-family="Arial, sans-serif" font-size="12" fill="#334155">Application</text>
  
  <rect x="870" y="35" width="15" height="15" fill="#dcfce7" stroke="#34d399" stroke-width="1" />
  <text x="890" y="48" font-family="Arial, sans-serif" font-size="12" fill="#334155">Services</text>
  
  <rect x="870" y="55" width="15" height="15" fill="#fee2e2" stroke="#f87171" stroke-width="1" />
  <text x="890" y="68" font-family="Arial, sans-serif" font-size="12" fill="#334155">External</text>
</svg>
